name: ci

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Lint
        run: |
          python -m pip install -r requirements-dev.txt
          make lint

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: make install
      - name: Test
        run: make test
      - name: Demo (review packet must stay reproducible)
        run: |
          # The sample DPA is BLOCKED by design, so the CLI must exit exactly 2.
          set +e
          make demo
          status=$?
          set -e
          if [ "$status" -ne 2 ]; then
            echo "::error::demo exited with $status, expected 2 (BLOCKED)"
            exit 1
          fi
          # Regenerated examples/ must match what is committed (including new files).
          git add --intent-to-add examples
          git diff --exit-code -- examples

  coverage:
    # The whole suite under coverage, including the JSON Schema cross-checks that the
    # standard-library test job skips because jsonschema is not installed there.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Test with coverage
        run: |
          python -m pip install -r requirements-dev.txt
          make coverage
          python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

  action:
    # Runs the composite action from this checkout the way a consumer's workflow would: the
    # BLOCKED sample must fail the step, and a register of fixtures must report its worst state.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Review the sample, which is BLOCKED
        id: sample
        uses: ./
        continue-on-error: true
        with:
          input: data/sample_dpa.json
          out: ${{ runner.temp }}/sample
          sarif: ${{ runner.temp }}/sample.sarif
          annotate: "false"
      - name: Build a register from the fixtures that decide a review state
        run: |
          mkdir "$RUNNER_TEMP/register"
          jq -r 'to_entries[] | select(.value.exit_code != 3) | .key' tests/fixtures/expected.json |
            while read -r name; do cp "tests/fixtures/$name" "$RUNNER_TEMP/register/"; done
      - name: Review the register
        id: register
        uses: ./
        with:
          input: ${{ runner.temp }}/register
          out: ${{ runner.temp }}/register-out
          fail-on: never
          annotate: "false"
      - name: Check the outcomes
        env:
          SAMPLE_OUTCOME: ${{ steps.sample.outcome }}
          REGISTER_STATE: ${{ steps.register.outputs.review-state }}
          REGISTER_EXIT: ${{ steps.register.outputs.exit-code }}
          REGISTER_SUMMARY: ${{ steps.register.outputs.summary }}
        run: |
          test "$SAMPLE_OUTCOME" = failure
          jq -e '.review_state == "BLOCKED"' "$RUNNER_TEMP/sample/review-packet.json"
          jq -e '.version == "2.1.0" and (.runs[0].results | length) == 3' "$RUNNER_TEMP/sample.sarif"
          test "$REGISTER_STATE" = BLOCKED
          test "$REGISTER_EXIT" = 0
          grep -q "Worst review state: BLOCKED" "$REGISTER_SUMMARY"
