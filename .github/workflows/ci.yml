name: ci

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Lint
        run: |
          python -m pip install ruff
          make lint

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: make install
      - name: Test
        run: make test
      - name: Demo (review packet must stay reproducible)
        run: |
          # The sample DPA is BLOCKED by design, so the CLI must exit exactly 2.
          set +e
          make demo
          status=$?
          set -e
          if [ "$status" -ne 2 ]; then
            echo "::error::demo exited with $status, expected 2 (BLOCKED)"
            exit 1
          fi
          # Regenerated examples/ must match what is committed (including new files).
          git add --intent-to-add examples
          git diff --exit-code -- examples

  coverage:
    # The whole suite under coverage, including the JSON Schema cross-checks that the
    # standard-library test job skips because jsonschema is not installed there.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Test with coverage
        run: |
          python -m pip install coverage==7.16.2 jsonschema==4.26.0
          make coverage
          python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
