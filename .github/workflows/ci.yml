name: ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: make install
      - name: Test
        run: make test
      - name: Demo (review packet must stay reproducible)
        run: |
          # The sample DPA is BLOCKED by design, so the CLI must exit 2. Run it directly:
          # make would turn every non-zero exit, including a crash (3), into its own 2.
          set +e
          PYTHONPATH=src python -m dpa_review.cli --input data/sample_dpa.json --out examples --quiet
          status=$?
          set -e
          test "$status" -eq 2
          git diff --exit-code -- examples/
